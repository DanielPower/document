services:
  docket:
    image: ghcr.io/danielpower/document:latest
    # To build from this checkout instead of pulling, replace the line above with:
    # build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      # Originals, OCR'd PDFs and thumbnails. Back this up together with the database.
      - ./data:/data
      # Drop scans here (e.g. from a scanner's SMB/FTP target); they're ingested and removed.
      - ./consume:/consume
