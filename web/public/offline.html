<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Docket: can't connect</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c1f24; background: #f6f7f9; }
      @media (prefers-color-scheme: dark) { :root { color: #e6e8eb; background: #15171b; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      button { font: inherit; padding: 10px 18px; border-radius: 6px; border: none; background: #2563eb; color: white; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Docket</h1>
      <p>Docket is only available on your home network. Connect to Wi-Fi at home or turn on Tailscale, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
